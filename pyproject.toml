[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worker-reviewer"
version = "0.1.0"
description = "Mini-SWE on-policy context distillation"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "mini-swe-agent==2.4.6"]

[project.optional-dependencies]
train = ["torch", "transformers", "peft", "accelerate", "datasets", "safetensors", "huggingface-hub", "liger-kernel", "flash-linear-attention"]
serve = ["vllm"]
eval = ["datasets", "numpy", "scipy", "pandas", "sympy", "scikit-learn", "matplotlib"]

[project.scripts]
worker-reviewer = "worker_reviewer_bench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["worker_reviewer_bench*"]
namespaces = true

[tool.setuptools.package-data]
"worker_reviewer_bench.opd" = ["prompts/*.json"]
